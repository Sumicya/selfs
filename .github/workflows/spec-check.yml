name: spec-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check specification and CI policy
        shell: python
        run: |
          from pathlib import Path
          import re

          # 中文数字标题（第十八版 / 十九 / 二十…）必须能解析；
          # 此前的 `第(\d+)版` 只能匹配阿拉伯数字，导致本工作流自上线起每轮必红。
          CN_DIGITS = {c: i for i, c in enumerate("零一二三四五六七八九")}
          CN_NUM = r"([〇零一二三四五六七八九十]+)"

          def cn2int(text):
              if not text or any(ch not in CN_DIGITS and ch != "十" for ch in text):
                  raise ValueError(f"无法解析中文数字：{text!r}")
              if "十" in text:
                  left, _, right = text.partition("十")
                  total = (CN_DIGITS[left] + 1 if left else 1) * 10
                  if right:
                      total += CN_DIGITS[right]
                  return total
              value = 0
              for ch in text:
                  value = value * 10 + CN_DIGITS[ch]
              return value

          root = Path(".")
          global_text = (root / "GLOBAL.md").read_text(encoding="utf-8")
          changelog = (root / "CHANGELOG.md").read_text(encoding="utf-8")
          agents = root / "AGENTS.md"

          gh = re.search(rf"^# Sumicya 全项目规范（第{CN_NUM}版 · ([0-9-]+)）$", global_text, re.M)
          ch = re.search(rf"^## 第{CN_NUM}版 · ([0-9-]+)$", changelog, re.M)
          if not gh or not ch:
              raise SystemExit("GLOBAL.md 或 CHANGELOG.md 的最新版本标题格式不对（应为「第N版 · YYYY-MM-DD」，N 用中文数字）")
          if cn2int(gh.group(1)) != cn2int(ch.group(1)) or gh.group(2) != ch.group(2):
              raise SystemExit(
                  f"GLOBAL.md（第{gh.group(1)}版 · {gh.group(2)}）与 "
                  f"CHANGELOG.md（第{ch.group(1)}版 · {ch.group(2)}）的最新版本/日期不一致"
              )

          if not agents.exists():
              raise SystemExit("缺少 AGENTS.md")
          agents_text = agents.read_text(encoding="utf-8")
          stamp = re.search(rf"本仓库上次同步 = 第{CN_NUM}版", agents_text)
          if "GLOBAL.md" not in agents_text or not stamp:
              raise SystemExit("AGENTS.md 缺少 GLOBAL.md 指针或「本仓库上次同步 = 第N版」版本戳")
          if cn2int(stamp.group(1)) != cn2int(gh.group(1)):
              raise SystemExit(f"AGENTS.md 版本戳（第{stamp.group(1)}版）落后于 GLOBAL.md（第{gh.group(1)}版）")

          required = [
              "本地不得留下未提交更改",
              "不得自动创建 Release",
              "不得自动创建正式发行 tag",
              "Release 保留最近 1 个",
              "Actions artifact 保留最近 5 个",
              "actions/upload-artifact",
          ]
          for item in required:
              if item not in global_text:
                  raise SystemExit(f"GLOBAL.md 缺少强制规则：{item}")

          # 纯无产物仓库必须自报家底，避免会话再回「CI 不产出包」这类半句话。
          if "本仓库无可下载产物" not in agents_text and "本仓库没有可下载产物" not in agents_text:
              raise SystemExit("AGENTS.md 未写明本仓库有无可下载产物（无产物仓库须写「本仓库无可下载产物」）")

          workflows = root / ".github" / "workflows"
          forbidden = re.compile(
              r"(?i)(softprops/action-gh-release|gh release create|createRelease|create_git_release|actions/create-release)"
          )
          for path in sorted(workflows.glob("*.yml")):
              text = path.read_text(encoding="utf-8")
              if path.name != "spec-check.yml" and forbidden.search(text):
                  raise SystemExit(f"{path} 包含自动创建 Release 的实现；规范禁止 CI 自动发版")
              if path.name == "spec-check.yml":
                  if re.search(r"(?m)^\s*(contents|actions):\s*write\s*$", text):
                      raise SystemExit("spec-check.yml 不得拥有写权限")
                  if re.search(r"(?m)^\s*runs-on:\s*ubuntu-latest\s*$", text):
                      raise SystemExit("spec-check.yml 不得使用 ubuntu-latest（见禁旧条款）")

          print(f"规范检查通过：第 {gh.group(1)} 版 · {gh.group(2)}")
